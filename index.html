  </head>
  <body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Emergency unregister of any legacy service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        }).catch(function() {});
      }
      // Fail-safe error listener to show recovery UI instead of white screen
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:Prompt,system-ui,sans-serif;background:#f8fafc;color:#1e293b;text-align:center;">' +
            '<div style="background:#ffffff;border-radius:24px;padding:32px 24px;max-width:400px;width:100%;box-shadow:0 10px 25px -5px rgba(0,0,0,0.08);border:1px solid #e2e8f0;">' +
            '<div style="width:48px;height:48px;margin:0 auto 16px;background:#eff6ff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;">🔄</div>' +
            '<h2 style="font-size:17px;font-weight:700;margin:0 0 8px;color:#0f172a;">รีเฟรชข้อมูลระบบ</h2>' +
            '<p style="font-size:12px;color:#64748b;margin:0 0 20px;line-height:1.5;">ตรวจพบข้อมูลแคชเก่าในเบราว์เซอร์ กรุณากดปุ่มด้านล่างเพื่อล้างข้อมูลและโหลดใหม่</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});}if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});}window.location.reload();" style="width:100%;padding:12px 20px;background:#1c449c;color:#ffffff;border:none;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(28,68,156,0.25);">ล้างแคชและโหลดหน้านี้ใหม่</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
